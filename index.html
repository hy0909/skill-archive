<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스킬 아카이브</title>
<meta name="description" content="GitHub 스타와 자주 쓰는 웹 도구를 주제별, 직군별로 모아 둔 스킬 아카이브">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cal+Sans&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Cal.com DESIGN.md 기준: 흰 바탕, 검정 주 버튼, 연회색 카드(12px), 제목은 Cal Sans 600 + 좁은 자간, 본문은 Inter(한글 Pretendard), 바닥글만 어둡게 */
:root{
  --primary:#111111; --primary-active:#242424; --on-primary:#ffffff;
  --ink:#111111; --body:#374151; --muted:#6b7280; --muted-soft:#898989;
  --hairline:#e5e7eb; --hairline-soft:#f3f4f6;
  --canvas:#ffffff; --surface-soft:#f8f9fa; --surface-card:#f5f5f5; --surface-strong:#e5e7eb;
  --surface-dark:#101010; --surface-dark-el:#1a1a1a; --on-dark:#ffffff; --on-dark-soft:#a1a1aa;
  --link:#3b82f6; --star:#fb923c;
  --b-sk:#3b82f6; --b-ds:#34d399; --b-ft:#8b5cf6; --b-gr:#fb923c; --b-gd:#ec4899;
  --shadow:0 1px 2px rgba(17,17,17,.06),0 1px 1px rgba(17,17,17,.04);
  --f-display:"Cal Sans","Pretendard Variable",Pretendard,Inter,system-ui,sans-serif;
  --f-body:Inter,"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --f-code:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --primary:#ffffff; --primary-active:#e5e7eb; --on-primary:#111111;
  --ink:#f5f5f5; --body:#d1d5db; --muted:#9ca3af; --muted-soft:#8b8b8b;
  --hairline:#262626; --hairline-soft:#1c1c1c;
  --canvas:#0b0b0b; --surface-soft:#151515; --surface-card:#161616; --surface-strong:#262626;
  --surface-dark:#000000; --surface-dark-el:#141414; --link:#60a5fa;
  --shadow:0 1px 2px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --primary:#ffffff; --primary-active:#e5e7eb; --on-primary:#111111;
  --ink:#f5f5f5; --body:#d1d5db; --muted:#9ca3af; --muted-soft:#8b8b8b;
  --hairline:#262626; --hairline-soft:#1c1c1c;
  --canvas:#0b0b0b; --surface-soft:#151515; --surface-card:#161616; --surface-strong:#262626;
  --surface-dark:#000000; --surface-dark-el:#141414; --link:#60a5fa;
  --shadow:0 1px 2px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--canvas);color:var(--body);font-family:var(--f-body);font-size:16px;line-height:1.5;word-break:keep-all;-webkit-font-smoothing:antialiased}
.inner{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;color:var(--ink);margin:0;text-wrap:balance}

/* 레이아웃: 블로그형 2단. 왼쪽 고정 사이드바(검색·카테고리), 오른쪽 글 목록 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 16px;border-radius:8px;font:600 14px/1 var(--f-body);text-decoration:none;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:background .15s}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-primary:hover{background:var(--primary-active)}
.btn-secondary{background:var(--canvas);color:var(--ink);border-color:var(--hairline)}
.btn-secondary:hover{background:var(--surface-soft)}

.topnav{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--canvas) 90%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--hairline)}
.topnav .inner{height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.wordmark{font-family:"Cal Sans",var(--f-display);font-size:22px;letter-spacing:-.5px;color:var(--ink);text-decoration:none;white-space:nowrap}

.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:64px;padding-block:48px 96px}
.layout>*{min-width:0}
@media (max-width:900px){.layout{grid-template-columns:1fr;gap:24px;padding-block:24px 64px}}

/* 왼쪽 사이드바 */
.side{position:sticky;top:96px;align-self:start;display:flex;flex-direction:column;gap:28px;max-height:calc(100vh - 120px);overflow-y:auto;padding-right:4px}
@media (max-width:900px){.side{position:static;max-height:none;overflow:visible;gap:16px;padding:0}}
.field{display:flex;align-items:center;gap:10px;height:40px;border:1px solid var(--hairline);border-radius:8px;padding:0 12px;background:var(--canvas);color:var(--muted)}
.field:focus-within{border-color:var(--ink);box-shadow:0 0 0 3px var(--hairline)}
.field input{flex:1;min-width:0;border:0;background:transparent;font:400 15px/1.5 var(--f-body);color:var(--ink);outline:none}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-soft);border:1px solid var(--hairline-soft);border-radius:999px;padding:3px;margin-top:10px}
.seg button{font:500 13px/1.4 var(--f-body);border:0;background:transparent;color:var(--muted);height:30px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--canvas);color:var(--ink);box-shadow:var(--shadow)}
.navgroup h2{font:600 12px/1.4 var(--f-body);letter-spacing:.04em;color:var(--muted-soft);margin:0 0 8px 10px;font-family:var(--f-body)}
.navgroup ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.navgroup a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;font:500 14px/1.4 var(--f-body);color:var(--body);text-decoration:none}
.navgroup a:hover{background:var(--surface-soft);color:var(--ink)}
.navgroup a[aria-current="true"]{background:var(--surface-card);color:var(--ink);font-weight:600}
.navgroup .n{margin-left:auto;font:400 12px/1 var(--f-code);color:var(--muted-soft)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted));flex:none}
.av{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font:600 11px/1 var(--f-body);color:var(--ink);background:var(--surface-card);border:1px solid var(--hairline);flex:none}
.side .about{font-size:13px;line-height:1.6;color:var(--muted);margin:0;padding:16px;background:var(--surface-soft);border-radius:12px}
@media (max-width:900px){
  .navgroup{min-width:0}
  .navgroup h2{display:none}
  .navgroup ul{flex-direction:row;overflow-x:auto;gap:6px;scrollbar-width:none;padding-bottom:2px}
  .navgroup ul::-webkit-scrollbar{display:none}
  .navgroup a{border:1px solid var(--hairline);border-radius:999px;white-space:nowrap;padding:6px 12px}
  .navgroup a[aria-current="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
  .navgroup a[aria-current="true"] .n{color:inherit;opacity:.7}
  .side .about{display:none}
}

/* 오른쪽 글 목록 */
.feedhead{padding-bottom:28px;border-bottom:1px solid var(--hairline)}
.feedhead .crumb{font:500 13px/1.4 var(--f-body);color:var(--muted);display:flex;align-items:center;gap:8px}
.feedhead h1{font-size:clamp(34px,4.4vw,48px);line-height:1.1;letter-spacing:-1.5px;margin:10px 0 12px}
.feedhead p{margin:0;font-size:17px;color:var(--muted);max-width:36em}
.post{padding:32px 0;border-bottom:1px solid var(--hairline);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 32px}
.post .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font:500 13px/1.4 var(--f-body);color:var(--muted)}
.post .meta .sep{color:var(--hairline)}
.post .meta .code{font-family:var(--f-code);font-weight:400}
.post .meta .star{color:var(--star)}
.post h2{font-size:clamp(24px,2.6vw,28px);line-height:1.2;letter-spacing:-.5px;overflow-wrap:anywhere}
.post h2 a{color:inherit;text-decoration:none}
.post h2 a:hover{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}
.post .owner{font:400 13px/1.4 var(--f-code);color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.post .body{grid-column:1;min-width:0;display:flex;flex-direction:column;gap:14px}
.post .desc{margin:0;font-size:16px;line-height:1.7;color:var(--body);max-width:40em}
.fragment{background:var(--surface-card);border-radius:12px;padding:14px 16px;font-size:15px;line-height:1.6;color:var(--body);max-width:40em}
.fragment .who{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--ink);margin-bottom:4px}
.fragment .who .av{background:var(--canvas)}
.post .tags{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.chip{font:500 12px/1.4 var(--f-body);background:var(--surface-card);color:var(--body);border-radius:999px;padding:3px 10px}
.chip.role{display:inline-flex;align-items:center;gap:6px;padding-left:4px;background:var(--canvas);border:1px solid var(--hairline)}
.chip.role .av{width:18px;height:18px;font-size:10px;border:0}
.post .links{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;gap:8px;align-self:start;padding-top:4px}
@media (max-width:640px){.post{grid-template-columns:1fr}.post .links{grid-column:1;grid-row:auto;flex-direction:row}}
.empty{padding:64px 0;color:var(--muted)}

footer{background:var(--surface-dark);color:var(--on-dark-soft);font-size:14px}
footer .inner{padding-block:56px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:24px}
footer .wordmark{color:var(--on-dark)}
footer a{color:var(--on-dark);text-decoration:none}
footer a:hover{text-decoration:underline}
footer .cols{display:flex;gap:48px;flex-wrap:wrap}
footer .cols div{display:flex;flex-direction:column;gap:8px}
footer .cols b{color:var(--on-dark);font-weight:600;margin-bottom:4px}
footer small{display:block;margin-top:12px;color:var(--muted-soft)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<nav class="topnav"><div class="inner">
  <a class="wordmark" href="#all">Skill Archive</a>
  <a class="btn btn-primary" href="https://github.com/hy0909?tab=stars" target="_blank" rel="noopener">GitHub 스타</a>
</div></nav>

<div class="inner layout">
  <aside class="side" aria-label="카테고리">
    <div>
      <label class="field">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="이름, 설명, 태그로 찾기" aria-label="검색">
      </label>
      <div class="seg" aria-label="출처">
        <button id="src-all" data-src="all" aria-pressed="true">전체</button>
        <button id="src-repo" data-src="repo" aria-pressed="false">GitHub</button>
        <button id="src-site" data-src="site" aria-pressed="false">웹사이트</button>
      </div>
    </div>
    <nav class="navgroup" aria-label="주제"><h2>주제</h2><ul id="nav-topic"></ul></nav>
    <nav class="navgroup" aria-label="직군"><h2>직군</h2><ul id="nav-role"></ul></nav>
    <p class="about">GitHub에서 스타를 누른 저장소와 자주 쓰는 웹 도구를 모았습니다. 스타 수는 2026-11-25 기준입니다.</p>
  </aside>

  <main>
    <header class="feedhead">
      <div class="crumb" id="crumb">스킬 아카이브</div>
      <h1 id="title">전체 글</h1>
      <p id="lede"></p>
    </header>
    <div id="feed"></div>
  </main>
</div>

<footer><div class="inner">
  <div><span class="wordmark">Skill Archive</span><small>hy0909 · 스타 수는 2026-11-25 기준</small></div>
  <div class="cols">
    <div><b>링크</b><a href="https://github.com/hy0909/skill-archive" target="_blank" rel="noopener">저장소</a><a href="https://github.com/hy0909?tab=stars" target="_blank" rel="noopener">GitHub 스타</a></div>
  </div>
</div></footer>

<script src="data.js"></script>
<script>
const $=s=>document.querySelector(s);
const fmt=n=>n>=1000?(n/1000).toFixed(n>=100000?0:1).replace(/\.0$/,"")+"k":String(n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const topicOf=id=>TOPICS.find(t=>t.id===id);
const roleName=id=>ROLES.find(r=>r.id===id).name;
let src="all";

function parseHash(){const h=location.hash.slice(1);
  let m=h.match(/^topic-(\w+)$/);if(m&&topicOf(m[1]))return{type:"topic",id:m[1]};
  m=h.match(/^role-(\w+)$/);if(m&&ROLES.find(r=>r.id===m[1]))return{type:"role",id:m[1]};
  return null;}

function match(x,q){if(!q)return true;
  const hay=[x.n,x.d,x.l,...x.tags,topicOf(x.t).name,...Object.keys(x.r).map(roleName),...Object.values(x.r)].join(" ").toLowerCase();
  return q.toLowerCase().split(/\s+/).every(w=>hay.includes(w));}

function post(x,role){
  const t=topicOf(x.t);const isRepo=x.kind==="repo";
  const [owner,name]=isRepo?x.n.split("/"):[new URL(x.site).hostname.replace(/^www\./,""),x.n];
  const href=isRepo?"https://github.com/"+x.n:x.site;
  const meta=[`<span class="dot" style="--c:var(--b-${x.t})"></span><a href="#topic-${x.t}" style="color:inherit;text-decoration:none">${t.name}</a>`,`<span class="code">${x.call}</span>`,
    isRepo?`<span><span class="star">★</span> ${fmt(x.s)}</span>`:"웹사이트",esc(x.l)].join('<span class="sep">/</span>');
  const frag=role?`<div class="fragment"><div class="who"><span class="av">${roleName(role)[0]}</span>${roleName(role)} 활용 목적</div>${esc(x.r[role])}</div>`:"";
  const roles=Object.keys(x.r).map(r=>`<a class="chip role" href="#role-${r}" style="text-decoration:none"><span class="av">${roleName(r)[0]}</span>${roleName(r)}</a>`).join("");
  const tags=x.tags.slice(0,3).map(g=>`<span class="chip">#${esc(g)}</span>`).join("");
  return `<article class="post">
    <div class="meta">${meta}</div>
    <div class="body">
      <div><h2><a href="${href}" target="_blank" rel="noopener">${esc(name)}</a></h2><div class="owner">${esc(owner)}</div></div>
      <p class="desc">${esc(x.d)}</p>${frag}
      <div class="tags">${roles}${tags}</div>
    </div>
    <div class="links"><a class="btn btn-primary" href="${href}" target="_blank" rel="noopener">${isRepo?"GitHub":"사이트 열기"}</a>${isRepo&&x.site?`<a class="btn btn-secondary" href="${x.site}" target="_blank" rel="noopener">사이트</a>`:""}</div>
  </article>`;
}

function render(){
  const sel=parseHash();const q=$("#q").value.trim();
  const base=ITEMS.filter(x=>match(x,q)&&(src==="all"||x.kind===src||(src==="site"&&x.site)));
  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.src===src));
  const cur=(t,id)=>sel?(sel.type===t&&sel.id===id):(t==="all");
  $("#nav-topic").innerHTML=`<li><a href="#all" aria-current="${cur("all")}"><span class="dot" style="--c:var(--ink)"></span>전체<span class="n">${base.length}</span></a></li>`+
    TOPICS.map(t=>`<li><a href="#topic-${t.id}" aria-current="${cur("topic",t.id)}"><span class="dot" style="--c:var(--b-${t.id})"></span>${t.name}<span class="n">${base.filter(x=>x.t===t.id).length}</span></a></li>`).join("");
  $("#nav-role").innerHTML=ROLES.map(r=>`<li><a href="#role-${r.id}" aria-current="${cur("role",r.id)}"><span class="av">${r.name[0]}</span>${r.name}<span class="n">${base.filter(x=>x.r[r.id]).length}</span></a></li>`).join("");
  let items=base,title="전체 글",lede="스타를 누른 GitHub 저장소와 자주 쓰는 웹 도구입니다. 주제나 직군을 골라 보세요.",crumb="스킬 아카이브",role=null;
  if(sel&&sel.type==="topic"){const t=topicOf(sel.id);items=base.filter(x=>x.t===sel.id);title=t.name;lede=t.desc;crumb=`<span class="dot" style="--c:var(--b-${t.id})"></span>주제`}
  if(sel&&sel.type==="role"){const r=ROLES.find(r=>r.id===sel.id);items=base.filter(x=>x.r[sel.id]);title=r.name+"를 위한 도구";lede=r.desc+"입니다. 항목마다 어떻게 쓰는지 적어 두었습니다.";crumb=`<span class="av">${r.name[0]}</span>직군`;role=sel.id}
  if(q)lede=`“${esc(q)}” 검색 결과 ${items.length}개`;
  $("#crumb").innerHTML=crumb;$("#title").textContent=title;$("#lede").innerHTML=lede;
  $("#feed").innerHTML=items.map(x=>post(x,role)).join("")||`<p class="empty">맞는 항목이 없습니다. 다른 낱말로 찾거나 「전체」를 눌러 보세요.</p>`;
}
addEventListener("hashchange",()=>{render();scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})});
document.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click",()=>{src=b.dataset.src;render()}));
$("#q").addEventListener("input",render);
render();
</script>
</body>
</html>
