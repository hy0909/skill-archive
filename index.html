   tags:["svg","gradient"],
   r:{mkt:"배너·썸네일 배경용 그라데이션을 만든다."}},
  {n:"Aurora Gradient Editor",kind:"site",site:"https://a-bashtannik.github.io/aurora-gradient-editor/",t:"gd",s:null,l:"웹",
   d:"색 덩어리를 겹쳐 오로라 느낌 배경을 만드는 편집기. 기준 색 하나만 바꾸면 나머지 색이 어울리게 따라 바뀌고, CSS와 SwiftUI 코드로 내보낸다.",
   tags:["aurora","css","swiftui","oklch"],
   r:{dev:"앱 배경을 CSS·SwiftUI 코드로 바로 가져간다.",mkt:"브랜드 색 하나로 어울리는 배경을 만든다."}}
];
ITEMS.forEach(x=>{x.kind=x.kind||"repo"});
ITEMS.sort((a,b)=>(b.s??-1)-(a.s??-1));
TOPICS.forEach(t=>{let i=0;ITEMS.filter(x=>x.t===t.id).forEach(x=>x.call=t.code+"-"+String(++i).padStart(2,"0"))});

const $=s=>document.querySelector(s);
const fmt=n=>n>=1000?(n/1000).toFixed(n>=100000?0:1).replace(/\.0$/,"")+"k":String(n);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const topicOf=id=>TOPICS.find(t=>t.id===id);
const roleName=id=>ROLES.find(r=>r.id===id).name;

let view="topic",src="all";
document.querySelectorAll(".src button").forEach(b=>b.addEventListener("click",()=>{src=b.dataset.src;render()}));
try{const v=localStorage.getItem("sa-view");if(v==="role"||v==="topic")view=v}catch(e){}
if(location.hash==="#role"||location.hash==="#topic")view=location.hash.slice(1);

function match(x,q){
  if(!q)return true;
  const hay=[x.n,x.d,x.l,...x.tags,topicOf(x.t).name,...Object.keys(x.r).map(roleName),...Object.values(x.r)].join(" ").toLowerCase();
  return q.toLowerCase().split(/\s+/).every(w=>hay.includes(w));
}

function card(x,role){
  const t=topicOf(x.t);const isRepo=x.kind==="repo";
  const [owner,name]=isRepo?x.n.split("/"):[new URL(x.site).hostname.replace(/^www\./,""),x.n];
  const href=isRepo?"https://github.com/"+x.n:x.site;
  const why=role?`<p class="why"><b>${roleName(role)}</b> · ${esc(x.r[role])}</p>`:"";
  const roles=role?"":Object.keys(x.r).map(r=>`<span class="chip role">${roleName(r)}</span>`).join("");
  const right=isRepo?`<span class="stars" title="${x.s.toLocaleString()} stars">★ ${fmt(x.s)}</span>`:`<span class="site-badge">웹사이트</span>`;
  const links=`<div class="links"><a href="${href}" target="_blank" rel="noopener">${isRepo?"GitHub":"사이트 열기"} ↗</a>${isRepo&&x.site?`<a href="${x.site}" target="_blank" rel="noopener">사이트 ↗</a>`:""}</div>`;
  return `<article class="card" style="--gc:var(--c-${x.t})">
    <div class="top"><span class="call">${x.call} · ${t.name}</span>${right}</div>
    <div><h4><a href="${href}" target="_blank" rel="noopener">${esc(name)}</a></h4><div class="owner">${esc(owner)}</div></div>
    <p class="desc">${esc(x.d)}</p>${why}${links}
    <div class="chips">${roles}<span class="chip lang">${x.l}</span>${x.tags.slice(0,3).map(g=>`<span class="chip">#${esc(g)}</span>`).join("")}</div>
  </article>`;
}

function render(){
  const q=$("#q").value.trim();
  const items=ITEMS.filter(x=>match(x,q)&&(src==="all"||x.kind===src||(src==="site"&&x.site)));
  document.querySelectorAll(".src button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.src===src));
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.view===view));
  const groups=view==="topic"
    ?TOPICS.map(t=>({id:t.id,label:t.name,code:t.code,desc:t.desc,list:items.filter(x=>x.t===t.id),role:null}))
    :ROLES.map(r=>({id:r.id,label:r.name,code:null,desc:r.desc,list:items.filter(x=>x.r[r.id]),role:r.id}));
  $("#idx-title").textContent=view==="topic"?"주제":"직군";
  $("#idx-note").textContent=view==="topic"?"스타 목록을 내용 기준으로 묶었습니다. 한 저장소는 주제 하나에만 들어갑니다.":"한 저장소가 여러 직군에 함께 들어갈 수 있습니다. 카드마다 그 직군에서 어떻게 쓰는지 적어 두었습니다.";
  $("#idx").innerHTML=groups.map(g=>`<li><a href="#g-${g.id}" data-jump="g-${g.id}"><span>${g.label}</span><span class="n">${g.list.length}</span></a></li>`).join("");
  const html=groups.filter(g=>g.list.length).map(g=>`<section class="group" id="g-${g.id}" style="--gc:var(--c-${g.id in {sk:1,ds:1,ft:1,gr:1,gd:1}?g.id:"sk"})">
    <div class="ghead">${g.code?`<span class="code">${g.code}</span>`:""}<h3>${g.label}</h3><span class="n eyebrow">${g.list.length}개</span><p>${g.desc}</p></div>
    <div class="grid">${g.list.map(x=>card(x,g.role)).join("")}</div></section>`).join("");
  $("#list").innerHTML=html||`<p class="empty">“${esc(q)}”에 맞는 스킬이 없습니다. 다른 낱말로 찾아 보세요.</p>`;
}

document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{
  view=b.dataset.view;try{localStorage.setItem("sa-view",view)}catch(e){}
  history.replaceState(null,"","#"+view);render();
}));
$("#idx").addEventListener("click",e=>{const a=e.target.closest("a");if(!a)return;e.preventDefault();
  document.getElementById(a.dataset.jump)?.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})});
$("#q").addEventListener("input",render);
window.addEventListener("hashchange",()=>{if(location.hash==="#role"||location.hash==="#topic"){view=location.hash.slice(1);render()}});
render();
</script>
</body>
</html>
